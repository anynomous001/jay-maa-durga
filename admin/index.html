<!doctype html>
<html lang="en">
  <head>
    <!--@partial head-->
    <title>Sponsor bookings — admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <script type="module" src="/src/pages/admin.ts"></script>
  </head>
  <body>
    <main id="main" class="admin">
      <section class="page-head">
        <h1>Sponsor bookings</h1>
        <p class="lead">Review paid bookings. <strong>Approve</strong> makes the ad live within a minute (no rebuild). <strong>Reject</strong> can refund through Razorpay.</p>
      </section>

      <form class="panel admin-login" id="admin-login">
        <label class="field-label" for="admin-token">Admin token</label>
        <div class="admin-login-row">
          <input class="input" id="admin-token" type="password" autocomplete="current-password" required />
          <button class="btn" type="submit">Open</button>
        </div>
        <p class="muted small">The token is the <code>ADMIN_TOKEN</code> secret set on the Worker. It's kept only in this tab.</p>
      </form>

      <section id="admin-app" hidden>
        <div class="admin-bar">
          <div class="pm-zones" id="admin-filters" role="group" aria-label="Filter"></div>
          <button class="btn btn-ghost btn-sm" type="button" id="admin-refresh">Refresh</button>
          <button class="btn btn-ghost btn-sm" type="button" id="admin-logout">Lock</button>
        </div>
        <p class="admin-mock" id="admin-mock" hidden>TEST MODE — payments are simulated (no Razorpay keys set).</p>
        <p class="muted small" id="admin-status" role="status"></p>
        <div class="admin-list" id="admin-list"></div>
      </section>
    </main>
  </body>
</html>
